name: CI

on:
  push:
  pull_request:

jobs:
  host-tests:
    name: Host tests (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: g++ + sanitizers
            cxx: g++
            cxxflags: -Werror -g -fsanitize=address,undefined -fno-sanitize-recover=all
          - name: clang++
            cxx: clang++
            cxxflags: -Werror
    steps:
      - uses: actions/checkout@v4
      - name: Build and run
        env:
          CXX: ${{ matrix.cxx }}
          CXXFLAGS: ${{ matrix.cxxflags }}
        run: ./extras/test/run_tests.sh

  arduino-lint:
    name: Arduino Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/arduino-lint-action@v1
        with:
          compliance: specification
          library-manager: "false"

  compile-examples:
    name: Compile examples (${{ matrix.board.fqbn }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        board:
          - fqbn: arduino:avr:uno
            platforms: |
              - name: arduino:avr
          - fqbn: arduino:avr:mega
            platforms: |
              - name: arduino:avr
          - fqbn: arduino:mbed_rp2040:pico
            platforms: |
              - name: arduino:mbed_rp2040
          - fqbn: esp32:esp32:esp32
            platforms: |
              - name: esp32:esp32
                source-url: https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/compile-sketches@v1
        with:
          fqbn: ${{ matrix.board.fqbn }}
          platforms: ${{ matrix.board.platforms }}
          libraries: |
            - source-path: ./
          sketch-paths: |
            - examples
          cli-compile-flags: |
            - --warnings
            - all
